<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Zoho Project</title>
  <link rel="stylesheet" href="style.css?v=20260902-3" />
</head>
<body>
  <div id="progressOverlay" class="progress-overlay hidden" role="alertdialog" aria-modal="true" aria-live="polite" aria-labelledby="progressTitle">
    <div class="progress-card">
      <div id="progressSpinner" class="progress-spinner" aria-hidden="true"></div>
      <div id="progressIcon" class="progress-icon hidden" aria-hidden="true"></div>
      <h2 id="progressTitle">Project is being created.</h2>
      <p id="progressDetail" class="progress-detail hidden"></p>
      <p id="progressResult" class="progress-result hidden"></p>
      <button id="progressCloseButton" type="button" class="progress-close hidden">Close</button>
    </div>
  </div>
  <main class="wrap">
    <section class="card">
      <div class="header">
        <div>
          <h1>Create Project</h1>
          <p id="subtitle" class="hidden">Checking deal requirements...</p>
        </div>
        <span id="statusBadge" class="badge hidden">Loading</span>
      </div>

      <div id="message" class="message info hidden">Loading the Deal from Zoho CRM.</div>

      <details id="existingDealInfo" class="existing-deal-info hidden">
        <summary>
          <span class="existing-info-copy">
            <span class="existing-info-title">Existing Deal Information for Project</span>
            <span class="existing-info-subtitle">Review the details that will be transferred automatically.</span>
          </span>
          <span class="existing-info-action" aria-hidden="true">View details</span>
        </summary>
        <div id="existingDealInfoGrid" class="existing-info-grid"></div>
      </details>

      <form id="fieldsForm" class="fields hidden">
        <div id="fieldContainer"></div>
      </form>

      <div class="actions">
        <button id="refreshButton" type="button" class="secondary">Recheck Deal</button>
        <button id="createButton" type="button" disabled>Create Project</button>
      </div>

      <pre id="debug" class="debug hidden"></pre>
    </section>
  </main>

  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <script src="config.js?v=20260902-3"></script>
  <script src="app.js?v=20260902-3"></script>
</body>
</html>
